name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'stage/*'
  merge_group:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full suite (including full Godot non-bot suite)
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  GODOT_VERSION: '4.7.2-stable'
  GODOT_ZIP_SHA512: '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65'
  GODOT_BIN_SHA256: '8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e'

jobs:
  changes:
    name: Select affected surfaces
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      lint: ${{ steps.select.outputs.lint }}
      docs: ${{ steps.select.outputs.docs }}
      node: ${{ steps.select.outputs.node }}
      web: ${{ steps.select.outputs.web }}
      godot: ${{ steps.select.outputs.godot }}
    steps:
      - name: Checkout selector script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Classify diff
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "${CHANGED_FILES:-0}" -gt 0 && "${CHANGED_FILES:-0}" -le 3000 ]]; then
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files?per_page=100" \
              --paginate --jq '.[] | .filename, (.previous_filename // empty)' \
              | node scripts/ci/affected.mjs --stdin --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci/affected.mjs --full --github-output "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint & project checks
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run JS lint, format, sketch-lint, project, skills and briefs checks
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label lint:js --budget 5 -- npm run lint:js
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci/check-budget.mjs --label format:changed --budget 5 -- node scripts/ci/format-changed.mjs --base "${{ github.event.pull_request.base.sha }}"
          fi
          node scripts/ci/check-budget.mjs --label sketch:lint --budget 5 -- npm run sketch:lint
          node scripts/ci/check-budget.mjs --label check:project --budget 5 -- npm run check:project
          node scripts/ci/check-budget.mjs --label check:skills --budget 5 -- npm run check:skills
          node scripts/ci/check-budget.mjs --label check:briefs --budget 5 -- npm run check:briefs

  docs:
    name: Docs & wave-state checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run check:docs (budget 5s)
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label check:docs --budget 5 -- npm run check:docs

  node-tests:
    name: Node unit tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout (blobless, read-only token for lazy blob fetch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Restore apt ffmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-ffmpeg-debs
          key: ${{ runner.os }}-${{ runner.arch }}-apt-ffmpeg-v1

      - name: Ensure ffprobe/ffmpeg for audio and brief tests
        env:
          DEB_DIR: ${{ runner.temp }}/apt-ffmpeg-debs
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            if [[ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" == "true" && -d "$DEB_DIR" ]] && ls "$DEB_DIR"/*.deb >/dev/null 2>&1; then
              sudo dpkg -i "$DEB_DIR"/*.deb >/dev/null 2>&1 || sudo apt-get -f install -y --no-install-recommends >/dev/null
            else
              sudo apt-get update -qq
              mkdir -p "$DEB_DIR"
              sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$DEB_DIR" ffmpeg >/dev/null
            fi
          fi

      - name: Run Node test shard ${{ matrix.shard }}/2 in shuffled order (budget 60s, zero retries)
        env:
          SCRAPKEEP_WHOLE_TESTS: '1'
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label "node-tests-${{ matrix.shard }}/2" --budget 60 -- \
            node scripts/ci/node-tests.mjs --shard "${{ matrix.shard }}/2" --shuffle --seed "${{ github.run_id }}"

  web-build:
    name: Browser proof build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build and verify static output (budget 30s)
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label vite-build --budget 20 -- npm run build
          node scripts/ci/check-budget.mjs --label check:build --budget 10 -- npm run check:build

  godot-affected:
    name: Godot affected tests
    needs: changes
    if: needs.changes.outputs.godot == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout (blobless, read-only token for base worktree/promisor)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Godot binary cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_SHA256 }}

      - name: Install pinned Godot on cache miss
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GODOT_DIR: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          godot_bin="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$GODOT_DIR/editor.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          printf '%s  %s\n' "$GODOT_ZIP_SHA512" "$GODOT_DIR/editor.zip" | sha512sum --check --quiet
          python3 -I -c 'import sys, zipfile; from pathlib import Path; p = Path(sys.argv[2]); p.write_bytes(zipfile.ZipFile(sys.argv[1]).read(p.name)); p.chmod(0o755)' \
            "$GODOT_DIR/editor.zip" "$godot_bin"
          rm -f "$GODOT_DIR/editor.zip"
          printf '%s  %s\n' "$GODOT_BIN_SHA256" "$godot_bin" | sha256sum --check --quiet

      - name: Run affected Godot tests (or seed cache on push)
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
            node scripts/ci/check-budget.mjs --label godot-affected --budget 240 -- \
              node scripts/sketch-fast.mjs --base "$PR_BASE_SHA" --no-base-check --budget 120
          else
            echo "Cache seeded for Godot ${GODOT_VERSION} on ${REF_NAME}"
          fi

  godot-full:
    name: Godot full suite (${{ matrix.shard }}/4, duration-balanced)
    needs: changes
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.full_suite == true)
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Godot binary cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_SHA256 }}

      - name: Install pinned Godot on cache miss
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GODOT_DIR: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          godot_bin="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$GODOT_DIR/editor.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          printf '%s  %s\n' "$GODOT_ZIP_SHA512" "$GODOT_DIR/editor.zip" | sha512sum --check --quiet
          python3 -I -c 'import sys, zipfile; from pathlib import Path; p = Path(sys.argv[2]); p.write_bytes(zipfile.ZipFile(sys.argv[1]).read(p.name)); p.chmod(0o755)' \
            "$GODOT_DIR/editor.zip" "$godot_bin"
          rm -f "$GODOT_DIR/editor.zip"
          printf '%s  %s\n' "$GODOT_BIN_SHA256" "$godot_bin" | sha256sum --check --quiet

      - name: Run duration-balanced Godot shard ${{ matrix.shard }}/4
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/scrapkeep-godot-${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
        run: |
          set -euo pipefail
          tests="$(node scripts/ci/shard-plan.mjs --shard "${{ matrix.shard }}/4" --shuffle --seed "${{ github.run_id }}")"
          node scripts/gate/shard.mjs run --tests "$tests" --out "${{ runner.temp }}/godot-shard-${{ matrix.shard }}"

  ci-gate:
    name: CI gate
    needs: [changes, lint, docs, node-tests, web-build, godot-affected, godot-full]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Require all active jobs green
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          NODE_RESULT: ${{ needs.node-tests.result }}
          WEB_RESULT: ${{ needs.web-build.result }}
          GODOT_AFFECTED_RESULT: ${{ needs.godot-affected.result }}
          GODOT_FULL_RESULT: ${{ needs.godot-full.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job failed ($CHANGES_RESULT)" >&2
            exit 1
          fi
          for pair in \
            "lint:$LINT_RESULT" \
            "docs:$DOCS_RESULT" \
            "node-tests:$NODE_RESULT" \
            "web-build:$WEB_RESULT" \
            "godot-affected:$GODOT_AFFECTED_RESULT" \
            "godot-full:$GODOT_FULL_RESULT"; do
            name="${pair%%:*}"
            res="${pair#*:}"
            if [[ "$res" != "success" && "$res" != "skipped" ]]; then
              echo "job $name ended with $res" >&2
              exit 1
            fi
          done
          echo "All active CI jobs passed."
