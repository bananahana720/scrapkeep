name: CI

on:
  pull_request:
    branches:
      - main
      - 'stage/*'
  push:
    branches:
      - main
      - 'stage/*'
  merge_group:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full suite regardless of diff
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  GODOT_VERSION: '4.7.2-stable'
  GODOT_ZIP_SHA512: '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65'
  GODOT_BIN_SHA256: '8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e'

jobs:
  changes:
    name: Select affected surfaces
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    outputs:
      full: ${{ steps.select.outputs.full }}
      lint: ${{ steps.select.outputs.lint }}
      docs: ${{ steps.select.outputs.docs }}
      node: ${{ steps.select.outputs.node }}
      web: ${{ steps.select.outputs.web }}
      godot: ${{ steps.select.outputs.godot }}
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify diff
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "merge_group" || "${{ github.event_name }}" == "push" || "${{ inputs.full_suite }}" == "true" ]]; then
            node scripts/ci/affected.mjs --full --github-output "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --filter=blob:none origin "${{ github.base_ref }}"
            node scripts/ci/affected.mjs --base "origin/${{ github.base_ref }}" --github-output "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint & project checks
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run sketch-lint, project, skills and briefs checks
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label sketch:lint --budget 5 -- npm run sketch:lint
          node scripts/ci/check-budget.mjs --label check:project --budget 5 -- npm run check:project
          node scripts/ci/check-budget.mjs --label check:skills --budget 5 -- npm run check:skills
          node scripts/ci/check-budget.mjs --label check:briefs --budget 5 -- npm run check:briefs

  docs:
    name: Docs & wave-state checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run check:docs (budget 25s)
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label check:docs --budget 25 -- npm run check:docs

  node-tests:
    name: Node unit tests
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 4
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run Node test suite (budget 60s, zero retries)
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label node-tests --budget 60 -- npm test

  web-build:
    name: Browser proof build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nm-

      - name: Install locked dependencies on cache miss
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build and verify static output (budget 30s)
        run: |
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-budget.mjs --label vite-build --budget 20 -- npm run build
          node scripts/ci/check-budget.mjs --label check:build --budget 10 -- npm run check:build

  godot-affected:
    name: Godot affected tests
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Godot 4.7.2 binary cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/scrapkeep-godot-4.7.2
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_SHA256 }}

      - name: Install pinned Godot 4.7.2 on cache miss
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scrapkeep-godot-4.7.2
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/scrapkeep-godot-4.7.2/editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          printf '%s  %s\n' "$GODOT_ZIP_SHA512" /tmp/scrapkeep-godot-4.7.2/editor.zip | sha512sum --check --quiet
          python3 -I -c 'import zipfile; from pathlib import Path; p = Path("/tmp/scrapkeep-godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"); p.write_bytes(zipfile.ZipFile("/tmp/scrapkeep-godot-4.7.2/editor.zip").read(p.name)); p.chmod(0o755)'
          rm -f /tmp/scrapkeep-godot-4.7.2/editor.zip
          printf '%s  %s\n' "$GODOT_BIN_SHA256" /tmp/scrapkeep-godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 | sha256sum --check --quiet

      - name: Run affected Godot tests (or full non-bot suite on merge_group)
        shell: bash
        env:
          GODOT_BIN: /tmp/scrapkeep-godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          printf '| Check | Elapsed | Budget | Status |\n| --- | ---: | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "merge_group" || "${{ inputs.full_suite }}" == "true" ]]; then
            node scripts/sketch-smoke.mjs --sketch core-loop --receipt ci-full
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Cache seeded for Godot ${GODOT_VERSION} on ${{ github.ref_name }}"
          else
            git fetch --no-tags --filter=blob:none origin "${{ github.base_ref }}"
            node scripts/ci/check-budget.mjs --label godot-affected --budget 180 -- \
              node scripts/sketch-fast.mjs --base "origin/${{ github.base_ref }}" --no-base-check --budget 120
          fi
