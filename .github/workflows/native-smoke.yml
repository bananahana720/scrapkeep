name: Native smoke and internal exports

on:
  workflow_dispatch:

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: [self-hosted, linux, x64, scrapkeep-s0]
    timeout-minutes: 20
    steps:
      - name: Initialize temporary toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$RUNNER_TEMP/scrapkeep-s0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            printf 'XDG_DATA_HOME=%s/data\n' "$toolchain_dir"
            printf 'XDG_CACHE_HOME=%s/cache\n' "$toolchain_dir"
            printf 'npm_config_cache=%s/npm-cache\n' "$toolchain_dir"
            printf 'GODOT_BIN=%s/Godot_v4.7.2-stable_linux.x86_64\n' "$toolchain_dir"
            printf 'GODOT_TEMPLATES_ARCHIVE=%s/templates.tpz\n' "$toolchain_dir"
          } >> "$GITHUB_ENV"
      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          persist-credentials: false
          clean: true
      - name: Install the pinned editor and templates in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$(dirname "$GODOT_BIN")"
          mkdir -p "$toolchain_dir"
          curl --fail --location --retry 3 --output "$toolchain_dir/editor.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output "$GODOT_TEMPLATES_ARCHIVE" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          printf '%s  %s\n' 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65 "$toolchain_dir/editor.zip" | sha512sum --check
          printf '%s  %s\n' ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079 "$GODOT_TEMPLATES_ARCHIVE" | sha512sum --check
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          editor = Path(os.environ["GODOT_BIN"])
          with ZipFile(editor.parent / "editor.zip") as archive:
              editor.write_bytes(archive.read(editor.name))
          editor.chmod(0o755)
          templates = Path(os.environ["XDG_DATA_HOME"]) / "godot/export_templates/4.7.2.stable"
          templates.mkdir(parents=True, exist_ok=True)
          with ZipFile(os.environ["GODOT_TEMPLATES_ARCHIVE"]) as archive:
              for name in ["version.txt", "linux_debug.x86_64", "linux_release.x86_64", "windows_debug_x86_64.exe", "windows_release_x86_64.exe"]:
                  (templates / name).write_bytes(archive.read("templates/" + name))
          PY
          printf '%s  %s\n' 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e "$GODOT_BIN" | sha256sum --check
      - name: Install locked dependencies and check the project
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:docs
          npm run check:project
          node --test tests/native-smoke.test.js
      - name: Run proofs, export both targets and execute Linux
        shell: bash
        run: node scripts/native-smoke.mjs --export
      - name: Retain the report in the log and job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=artifacts/local/native-smoke/report.json
          if [[ ! -f "$report" ]]; then
            printf 'Native smoke produced no report. See the failing step.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$report"
          {
            printf '## Native smoke report\n\n```json\n'
            cat "$report"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
