<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="400" viewBox="0 0 880 400" font-family="Noto Sans, sans-serif">
  <title>Scrapkeep icon grammar specimen (VISUAL-LANGUAGE.md section 5)</title>
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#242a28"/>
      <rect width="4" height="8" fill="#ff5a3c"/>
    </pattern>
    <clipPath id="triangle-band">
      <rect x="0" y="46" width="64" height="12"/>
    </clipPath>

    <symbol id="cls_sable" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#242a28"/>
      <circle cx="32" cy="34" r="14" fill="none" stroke="#8bf0d3" stroke-width="6"/>
      <rect x="10" y="12" width="14" height="8" rx="2" fill="#d2c5a5" transform="rotate(-30 17 16)"/>
      <rect x="40" y="12" width="14" height="8" rx="2" fill="#d2c5a5" transform="rotate(30 47 16)"/>
    </symbol>

    <symbol id="cls_rivet" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#242a28"/>
      <polyline points="28,16 46,32 28,48" fill="none" stroke="#b77843" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="22" y1="20" x2="14" y2="26" stroke="#d2c5a5" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="32" x2="12" y2="32" stroke="#d2c5a5" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="44" x2="14" y2="38" stroke="#d2c5a5" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <symbol id="cls_kest" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#242a28"/>
      <polygon points="32.0,14.0 35.1,24.5 44.7,19.3 39.5,28.9 50.0,32.0 39.5,35.1 44.7,44.7 35.1,39.5 32.0,50.0 28.9,39.5 19.3,44.7 24.5,35.1 14.0,32.0 24.5,28.9 19.3,19.3 28.9,24.5" fill="#e5a044"/>
      <path d="M44.7 19.3 C 50 14, 54 16, 52 10" fill="none" stroke="#d2c5a5" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <symbol id="thr_wave" viewBox="0 0 64 64">
      <polygon points="32,5 61,57 3,57" fill="#242a28" stroke="#ff5a3c" stroke-width="4" stroke-linejoin="miter"/>
      <polygon points="32,5 61,57 3,57" fill="url(#stripes)" clip-path="url(#triangle-band)"/>
      <path d="M20 42 Q 32 26 44 42" fill="none" stroke="#ff5a3c" stroke-width="5" stroke-linecap="butt"/>
      <polyline points="28,24 32,19 36,24" fill="none" stroke="#d2c5a5" stroke-width="4"/>
      <polyline points="17,32 19,26 25,27" fill="none" stroke="#d2c5a5" stroke-width="4"/>
      <polyline points="39,27 45,26 47,32" fill="none" stroke="#d2c5a5" stroke-width="4"/>
    </symbol>

    <symbol id="cat_charge" viewBox="0 0 64 64">
      <polygon points="60,32 46,56.2 18,56.2 4,32 18,7.8 46,7.8" fill="#242a28" stroke="#d2c5a5" stroke-width="2"/>
      <rect x="22" y="16" width="20" height="34" rx="4" fill="none" stroke="#d2c5a5" stroke-width="6"/>
      <rect x="28" y="11" width="8" height="5" fill="#d2c5a5"/>
      <rect x="27" y="22" width="10" height="5" fill="#8bf0d3"/>
      <rect x="27" y="30" width="10" height="5" fill="#8bf0d3"/>
      <rect x="27" y="38" width="10" height="5" fill="#8bf0d3"/>
    </symbol>

    <symbol id="obj_gate" viewBox="0 0 64 64">
      <rect x="4" y="4" width="56" height="56" fill="#242a28"/>
      <path d="M6 16 V6 H16 M48 6 H58 V16 M58 48 V58 H48 M16 58 H6 V48" fill="none" stroke="#d2c5a5" stroke-width="4"/>
      <rect x="18" y="24" width="7" height="26" fill="#d2c5a5"/>
      <rect x="39" y="24" width="7" height="26" fill="#d2c5a5"/>
      <rect x="15" y="20" width="34" height="6" fill="#d2c5a5"/>
      <polygon points="32,10 38,18 32,26 26,18" fill="#e5a044"/>
    </symbol>
  </defs>

  <rect width="880" height="400" fill="#242a28"/>
  <text x="24" y="36" fill="#d2c5a5" font-size="20" font-weight="700">Icon grammar</text>
  <text x="24" y="58" fill="#d2c5a5" font-size="13">64 px master above, 24 px minimum below. Bone glyph on charcoal, one accent region.</text>

  <g font-size="13" fill="#d2c5a5">
    <rect x="16" y="76" width="848" height="160" fill="#365754" opacity="0.35"/>
    <use xlink:href="#cls_sable" x="40" y="90" width="64" height="64"/>
    <use xlink:href="#cls_sable" x="60" y="170" width="24" height="24"/>
    <text x="40" y="220">cls_sable</text>
    <use xlink:href="#cls_rivet" x="180" y="90" width="64" height="64"/>
    <use xlink:href="#cls_rivet" x="200" y="170" width="24" height="24"/>
    <text x="180" y="220">cls_rivet</text>
    <use xlink:href="#cls_kest" x="320" y="90" width="64" height="64"/>
    <use xlink:href="#cls_kest" x="340" y="170" width="24" height="24"/>
    <text x="320" y="220">cls_kest</text>
    <use xlink:href="#thr_wave" x="460" y="90" width="64" height="64"/>
    <use xlink:href="#thr_wave" x="480" y="170" width="24" height="24"/>
    <text x="460" y="220">thr_wave</text>
    <use xlink:href="#cat_charge" x="600" y="90" width="64" height="64"/>
    <use xlink:href="#cat_charge" x="620" y="170" width="24" height="24"/>
    <text x="600" y="220">cat_charge</text>
    <use xlink:href="#obj_gate" x="740" y="90" width="64" height="64"/>
    <use xlink:href="#obj_gate" x="760" y="170" width="24" height="24"/>
    <text x="740" y="220">obj_gate</text>
  </g>

  <text x="24" y="270" fill="#d2c5a5" font-size="16" font-weight="700">Rarity frames: shape first, colour second</text>
  <g font-size="13" fill="#d2c5a5">
    <rect x="40" y="290" width="56" height="56" rx="4" fill="none" stroke="#d2c5a5" stroke-width="2"/>
    <text x="40" y="370">common, thin</text>
    <rect x="240" y="290" width="56" height="56" rx="4" fill="none" stroke="#8bf0d3" stroke-width="5"/>
    <text x="240" y="370">uncommon, bold</text>
    <rect x="440" y="290" width="56" height="56" rx="4" fill="none" stroke="#e5a044" stroke-width="3"/>
    <rect x="446" y="296" width="44" height="44" rx="2" fill="none" stroke="#e5a044" stroke-width="3"/>
    <text x="440" y="370">rare, double</text>
    <rect x="640" y="290" width="56" height="56" rx="4" fill="none" stroke="#e5a044" stroke-width="3"/>
    <rect x="646" y="296" width="44" height="44" rx="2" fill="none" stroke="#8bf0d3" stroke-width="3"/>
    <circle cx="640" cy="290" r="4" fill="#d2c5a5"/>
    <circle cx="696" cy="290" r="4" fill="#d2c5a5"/>
    <circle cx="696" cy="346" r="4" fill="#d2c5a5"/>
    <circle cx="640" cy="346" r="4" fill="#d2c5a5"/>
    <text x="640" y="370">rare_plus, notched</text>
  </g>
</svg>
