<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Noto Sans, sans-serif">
  <title>Scrapkeep core-loop palette roles (VISUAL-LANGUAGE.md section 2)</title>
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#242a28"/>
      <rect width="6" height="12" fill="#ff5a3c"/>
    </pattern>
  </defs>
  <rect width="880" height="540" fill="#242a28"/>
  <text x="24" y="36" fill="#d2c5a5" font-size="20" font-weight="700">Palette roles</text>
  <text x="24" y="58" fill="#d2c5a5" font-size="13">AD-02 colours, three code extensions and one proposed extension. Text sits only on charcoal.</text>

  <g font-size="13">
    <rect x="24" y="80" width="88" height="56" rx="4" fill="#c6a274"/>
    <text x="24" y="154" fill="#d2c5a5" font-weight="700">Sandstone</text>
    <text x="24" y="170" fill="#d2c5a5">#c6a274 terrain</text>

    <rect x="232" y="80" width="88" height="56" rx="4" fill="#9b513a"/>
    <text x="232" y="154" fill="#d2c5a5" font-weight="700">Iron oxide</text>
    <text x="232" y="170" fill="#d2c5a5">#9b513a harm, Fleet paint</text>

    <rect x="440" y="80" width="88" height="56" rx="4" fill="#242a28" stroke="#d2c5a5" stroke-width="2"/>
    <text x="440" y="154" fill="#d2c5a5" font-weight="700">Oil charcoal</text>
    <text x="440" y="170" fill="#d2c5a5">#242a28 panels, keylines</text>

    <rect x="648" y="80" width="88" height="56" rx="4" fill="#365754"/>
    <text x="648" y="154" fill="#d2c5a5" font-weight="700">Weathered petrol</text>
    <text x="648" y="170" fill="#d2c5a5">#365754 bodies, cooldown</text>

    <rect x="24" y="196" width="88" height="56" rx="4" fill="#d2c5a5"/>
    <text x="24" y="270" fill="#d2c5a5" font-weight="700">Worn bone</text>
    <text x="24" y="286" fill="#d2c5a5">#d2c5a5 text, common, kinetic</text>

    <rect x="232" y="196" width="88" height="56" rx="4" fill="#b77843"/>
    <text x="232" y="270" fill="#d2c5a5" font-weight="700">Copper</text>
    <text x="232" y="286" fill="#d2c5a5">#b77843 Rivet, chevron</text>

    <rect x="440" y="196" width="88" height="56" rx="4" fill="#e5a044"/>
    <text x="440" y="270" fill="#d2c5a5" font-weight="700">Safety amber</text>
    <text x="440" y="286" fill="#d2c5a5">#e5a044 Kest, rare</text>

    <rect x="648" y="196" width="88" height="56" rx="4" fill="#8bf0d3"/>
    <text x="648" y="270" fill="#d2c5a5" font-weight="700">Field mint</text>
    <text x="648" y="286" fill="#d2c5a5">#8bf0d3 field, Sable, uncommon</text>

    <rect x="24" y="312" width="88" height="56" rx="0" fill="url(#stripes)" stroke="#ff5a3c" stroke-width="4"/>
    <text x="24" y="386" fill="#d2c5a5" font-weight="700">HAZARD (extension)</text>
    <text x="24" y="402" fill="#d2c5a5">#ff5a3c hostile only, striped</text>

    <rect x="232" y="312" width="88" height="56" rx="4" fill="#d9b44a"/>
    <text x="232" y="386" fill="#d2c5a5" font-weight="700">BRASS (extension)</text>
    <text x="232" y="402" fill="#d2c5a5">#d9b44a Brindle, requisition tag</text>

    <rect x="440" y="312" width="88" height="56" rx="4" fill="#c8f0ff"/>
    <text x="440" y="386" fill="#d2c5a5" font-weight="700">ICE (extension)</text>
    <text x="440" y="402" fill="#d2c5a5">#c8f0ff frost element</text>

    <g transform="translate(648 312)">
      <rect width="22" height="56" fill="#d2c5a5"/>
      <rect x="22" width="22" height="56" fill="#8bf0d3"/>
      <rect x="44" width="22" height="56" fill="#e5a044"/>
      <rect x="66" width="22" height="56" fill="#e5a044"/>
      <circle cx="77" cy="28" r="6" fill="#8bf0d3"/>
    </g>
    <text x="648" y="386" fill="#d2c5a5" font-weight="700">Rarity ramp</text>
    <text x="648" y="402" fill="#d2c5a5">common, uncommon, rare, rare_plus</text>

    <rect x="24" y="428" width="88" height="56" rx="0" fill="#365754"/>
    <line x1="24" y1="456" x2="112" y2="456" stroke="#a98cf0" stroke-width="3"/>
    <line x1="68" y1="428" x2="68" y2="484" stroke="#a98cf0" stroke-width="3"/>
    <text x="24" y="502" fill="#d2c5a5" font-weight="700">ANCIENT (proposed)</text>
    <text x="24" y="518" fill="#d2c5a5">#a98cf0 seams on ancient enamel</text>
  </g>
</svg>
