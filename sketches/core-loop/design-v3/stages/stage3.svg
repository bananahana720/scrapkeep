<text x="695" y="132" fill="#e3e5dd" font-size="13">Pipe depth 12; Warden bowl floor y10.</text>
<text x="695" y="159" fill="#e3e5dd" font-size="13">Relay mesa (92,−8), +10 m; walls/berm retained.</text>
