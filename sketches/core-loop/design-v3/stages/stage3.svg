<text x="695" y="213" fill="#e3e5dd" font-size="13">L west lip (8.4,23.8): y17.5, 34 m/s.</text>
<text x="695" y="240" fill="#e3e5dd" font-size="13">Dashed F/L→W: free ballistic flight; see arc table.</text>
<text x="695" y="267" fill="#e3e5dd" font-size="13">R cannon (30,74) → P wing landing (−40,−50).</text>
<text x="695" y="294" fill="#e3e5dd" font-size="13">P y38.43; flight 4.75 s; banked speed restored.</text>
<text x="695" y="321" fill="#e3e5dd" font-size="13">H hoop/scrap (30,−36) on fast pipe.</text>
<text x="695" y="348" fill="#e3e5dd" font-size="13">V existing vault (−40,−90); E fight (−52,−72).</text>
<text x="695" y="375" fill="#e3e5dd" font-size="13">T cache (−48,−96); A ally (−88,−20).</text>
<text x="695" y="402" fill="#e3e5dd" font-size="13">B timed drop trial (−48,−50); travel family R.</text>
<text x="695" y="429" fill="#e3e5dd" font-size="13">Surge continuation and dry causeway stay optional.</text>
<text x="695" y="456" fill="#e3e5dd" font-size="13">East mesa is an optional glide/grapple/combat branch.</text>
<text x="695" y="483" fill="#e3e5dd" font-size="13">Purple dotted: required sightlines, not raycast proof.</text>
<text x="695" y="510" fill="#e3e5dd" font-size="13">No return in the flood basin: miss recovery stays dry.</text>
