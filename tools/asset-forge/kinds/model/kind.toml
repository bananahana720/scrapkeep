name = "model"
description = "A static low-poly 3D model built by a Blender recipe."
runner = "blender"
entry = "entry.py"
brief = "brief.md"
validator = "validate.py"
promoter = "promote.py"
# Files `forge run` expects the entry to leave, relative to the version directory.
outputs = ["out/{asset}.glb", "out/{asset}.blend", "preview/sheet.png"]
sheet = "preview/sheet.png"
bands_key = "model"
