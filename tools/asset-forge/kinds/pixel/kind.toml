name = "pixel"
description = "Palette-strict pixel art (icons, UI, coins) drawn on an integer grid with pixkit, optional frame strip."
runner = "blender"   # pure Python inside Blender's interpreter; the entry also runs under plain python3
entry = "entry.py"
brief = "brief.md"
validator = "validate.py"
promoter = "promote.py"
# Files `forge run` expects the entry to leave, relative to the version directory.
outputs = ["out/{asset}.png", "out/{asset}.json", "preview/sheet.png"]
sheet = "preview/sheet.png"
# Key into the pack's bands (canvas edge in px), sizes (frames in the strip), draw_calls (colour budget) and promote tables.
bands_key = "pixel"
