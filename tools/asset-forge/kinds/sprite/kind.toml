name = "sprite"
description = "A palette-true directional sprite sheet rendered from a 3D model by a fixed camera and light rig."
runner = "blender"
entry = "entry.py"
brief = "brief.md"
validator = "validate.py"
promoter = "promote.py"
# Files `forge run` expects the entry to leave, relative to the version directory.
outputs = ["out/{asset}_sheet.png", "out/{asset}.json", "preview/sheet.png"]
sheet = "preview/sheet.png"
# Key into the pack's bands (frame edge in px), sizes (model extent in m), draw_calls (colour budget) and promote tables.
bands_key = "sprite"
band_label = "frame size in pixels"
