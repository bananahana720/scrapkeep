name = "vfx"
description = "A particle effect: a data spec of CPUParticles3D emitters, converted by the forge to a Godot scene."
# The entry is plain Python that happens to run in Blender's interpreter: the forge has one
# sandboxed runner and the recipe needs no Blender API.
runner = "blender"
entry = "entry.py"
brief = "brief.md"
validator = "validate.py"
promoter = "promote.py"
# Files `forge run` leaves, relative to the version directory. effect.tscn is written by the validator.
outputs = ["out/effect.json", "out/effect.tscn", "preview/sheet.png"]
sheet = "preview/sheet.png"
# Pack tables: bands.vfx = particle budget per category, sizes.vfx = cloud radius in metres,
# draw_calls.vfx = emitter cap (one draw call each).
bands_key = "vfx"
band_label = "particle budget"
