# Pack: the core-loop sketch's look. Paths are relative to the repository root.
name = "core-loop"
description = "Scrapkeep core-loop sketch: chunky low-poly, one flat colour per slot, Bible palette."
sketch = "sketches/core-loop"
palette_source = "sketches/core-loop/src/core/palette.gd"
helper_dir = "sketches/core-loop/tools/blender"   # holds common.py, the recipe helper module
inspect = "scripts/asset-inspect.mjs"
default_category = "prop"
# Optional, used when the checkout has them (proto/alpha does, main does not): per-class model
# caps that replace the model bands below, and the registry fragment directory promote writes to.
budgets = "sketches/core-loop/assets/asset_budgets.json"
registry = "sketches/core-loop/assets/registry.d"
# Review images stay out of assets/, which ships with the game and is scanned by the registry test.
previews = "sketches/core-loop/tools/blender/forge/previews"

[style]
# Sections are cut from the brief by their "## N." heading and appended to the system prompt.
brief = "sketches/core-loop/VISUAL-LANGUAGE.md"
sections = ["2", "9", "10"]
# Existing recipes copied into each version's reference/ for the agent to study.
examples = [
  "sketches/core-loop/tools/blender/common.py",
  "sketches/core-loop/tools/blender/chunks.py",
  "sketches/core-loop/tools/blender/reward_gate.py",
]

[palette]
# palette.gd constant -> the role name common.py uses. Colours are never copied here;
# they are parsed from palette_source at run time.
[palette.roles]
SAND = "bone"
SANDSTONE = "sandstone"
RUST = "oxide"
COPPER = "copper"
CHARCOAL = "charcoal"
VERDIGRIS = "petrol"
AMBER = "amber"
ARC = "mint"
ANCIENT = "ancient"
HAZARD = "hazard"
BRASS = "brass"
# Roles that VISUAL-LANGUAGE.md section 2 adds outside palette.gd, with the value
# common.py HEX carries for them (read from common.py, not repeated here).
[palette.extensions]
roles = ["ice"]

# Triangle bands per category, [low, high]. Precedent: chunks.py small/medium/large,
# shell_base.py SHELL_TRIS, warden_clamp.py KIT_TRIS.
[bands.model]
prop = [150, 1500]
kit = [800, 1500]
hero = [3000, 6500]
shell = [2000, 11000]

# Real-world size sanity per category: longest bounding-box edge in metres, [low, high].
[sizes.model]
prop = [0.15, 8.0]
kit = [0.5, 10.0]
hero = [1.0, 12.0]
shell = [1.6, 2.0]
default = [0.05, 40.0]

# Primitives (draw calls) allowed per category.
[draw_calls.model]
prop = 12
kit = 24
hero = 40
shell = 10

[promote.model]
models = "sketches/core-loop/assets/models"
recipes = "sketches/core-loop/tools/blender/forge"

# --- vfx ---
# The vfx kind reuses the bands/sizes/draw_calls tables under its own key. "prop" is the pack's
# default category, so it exists here; "burst" and "ambient" are the real ones.
# bands.vfx = particle budget [low, high] per effect. The ceiling is twice the largest pooled
# burst in vfx.gd (fountain, 24).
[bands.vfx]
prop = [1, 48]
burst = [1, 48]
ambient = [1, 24]

# Largest distance in metres any simulated particle may reach from the effect origin, [low, high].
[sizes.vfx]
prop = [0.1, 8.0]
burst = [0.1, 8.0]
ambient = [0.1, 8.0]

# Emitters per effect (one draw call each).
[draw_calls.vfx]
prop = 4
burst = 4
ambient = 3

[promote.vfx]
vfx = "sketches/core-loop/assets/vfx"

# --- terrain ---
# For the terrain kind. `band` is the allowed texture size in pixels (not triangles), `sizes`
# is the same range, and one material is one draw call.
[bands.terrain]
prop = [256, 1024]

[sizes.terrain]
prop = [256, 1024]

[draw_calls.terrain]
prop = 1

[promote.terrain]
textures = "sketches/core-loop/assets/textures"

# --- sprite/pixel ---
# sprite: bands = frame edge in px [low, high]; sizes = model extent in metres (as the model kind);
# draw_calls = colour budget (distinct opaque colours; over it is a warning).
# pixel: bands = canvas edge in px [low, high]; sizes = frames in the strip [low, high];
# draw_calls = colour budget.
[bands.sprite]
prop = [16, 96]
kit = [16, 128]
hero = [32, 192]

[sizes.sprite]
prop = [0.15, 8.0]
kit = [0.5, 10.0]
hero = [1.0, 12.0]

[draw_calls.sprite]
prop = 20
kit = 24
hero = 32

[bands.pixel]
prop = [8, 64]
kit = [8, 64]
hero = [16, 128]

[sizes.pixel]
prop = [1, 16]
kit = [1, 16]
hero = [1, 16]

[draw_calls.pixel]
prop = 12
kit = 16
hero = 24

[promote.sprite]
sprites = "sketches/core-loop/assets/sprites"

[promote.pixel]
sprites = "sketches/core-loop/assets/sprites"

# --- category profiles and refusals (model kind) ---
# A shell is the pilot mecha's ball: glass `Core` sphere and steered `Pod`, origin at the
# sphere centre, +Y forward, everything within 0.985 m (src/presentation/hero_assets.gd,
# tests/pilot_cannon_asset_test.gd on proto/alpha).
[profiles.model.shell]
brief = "brief.shell.md"
pivot = "centre"
max_radius = 0.985
required_nodes = ["Core", "Pod", "Dome"]

[refuse.model]
pilot = "pilots need a 25-bone rig and seven animation clips (tools/blender/PILOT-RIG.md); the model kind exports static meshes, so build pilots with the hand-written rig recipes"
