# Example pack plan: three scrapyard props made to match one another.
# Run: python3 tools/asset-forge/forge.py pack tools/asset-forge/plans/scrapyard_props.toml
pack = "core-loop"
kind = "model"
style = """Pack style shared by every piece: a scrapyard set from the same salvage crew.
Chunky, slightly oversized silhouettes with one bold read from the chase camera.
Oxide paint as the main body colour, bone bare_metal for bands, rims and hardware,
rubber for feet and grips, one small mint class_accent detail per piece.
Same bevel feel and the same rivet size on every piece; no piece busier than the others."""

[[asset]]
name = "scrap_barrel"
prompt = "A dented oil barrel, about 0.9 m tall, with two raised rings and a bung cap on the lid."

[[asset]]
name = "scrap_toolbox"
prompt = "A cantilever toolbox, about 0.6 m long, lid closed, with a chunky carry handle and a latch."

[[asset]]
name = "scrap_lamp_post"
prompt = "A short yard lamp post, about 2.2 m tall, on a weighted square foot, with a caged lamp head."
